name: Veluna CI & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-latest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Verify Rules, Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Android SDK licenses are accepted
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Validate Gradle Wrapper & Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Node test dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Materialize local emulator google-services.json for CI tests
        run: |
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "veluna-ci-test",
              "storage_bucket": "veluna-ci-test.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.veluna.music"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "100000000000-ci000000000000000000000000000000.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "veluna-ci-emulator-only-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Run Firestore security rules, unit tests, lint, and compile check
        run: |
          npx firebase emulators:exec --only firestore,auth --project veluna-ci-test \
            "FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 node --test firestore.test.js && chmod +x ./gradlew && ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug :app:compileReleaseKotlin --no-daemon --stacktrace"

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-test-lint-reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  instrumentation-test:
    name: Android Keystore Instrumentation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Android SDK licenses are accepted
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Validate Gradle Wrapper & Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Materialize local emulator google-services.json for instrumentation build
        run: |
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "veluna-ci-test",
              "storage_bucket": "veluna-ci-test.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.veluna.music"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "100000000000-ci000000000000000000000000000000.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "veluna-ci-emulator-only-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Run instrumentation tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/run-android-instrumentation-tests.sh

      - name: Surface Keystore security inspection results
        if: always()
        run: |
          {
            echo "### Android Keystore Security Inspection (API 34 Emulator)"
            echo '```text'
            {
              grep -h "KEYSTORE_SECURITY_REPORT\|KeyInfo report:" android-test-run.log keystore-logcat.txt 2>/dev/null || true
              if [ -d app/build/outputs/androidTest-results ]; then
                find app/build/outputs/androidTest-results -name "*.xml" -exec grep -h "KEYSTORE_SECURITY_REPORT\|KeyInfo report:" {} + 2>/dev/null || true
              fi
            } | sort -u || echo "No KEYSTORE_SECURITY_REPORT line captured."
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            android-test-run.log
            keystore-logcat.txt
          if-no-files-found: ignore
          retention-days: 7

  publish-latest-apk:
    name: Build & Publish Latest APK
    needs: [test, instrumentation-test]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle Wrapper & Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Require latest APK signing and Firebase secrets
        env:
          KS_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          EXPECTED_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          [ -n "$KS_B64" ] || { echo "Missing ANDROID_RELEASE_KEYSTORE_BASE64 secret"; exit 1; }
          [ -n "$KS_PASS" ] || { echo "Missing RELEASE_KEYSTORE_PASSWORD secret"; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "Missing RELEASE_KEY_ALIAS secret"; exit 1; }
          [ -n "$KEY_PASS" ] || { echo "Missing RELEASE_KEY_PASSWORD secret"; exit 1; }
          [ -n "$GS_JSON" ] || { echo "Missing GOOGLE_SERVICES_JSON secret"; exit 1; }
          [ -n "$EXPECTED_SHA256" ] || { echo "Missing RELEASE_CERT_SHA256 repository variable"; exit 1; }
          printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          printf '%s\n' "$GS_JSON" > app/google-services.json
          [ -s "$RUNNER_TEMP/release.jks" ] || { echo "Failed to decode release keystore"; exit 1; }
          [ -s app/google-services.json ] || { echo "Failed to write google-services.json"; exit 1; }

      - name: Assemble installable signed APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          VER_CODE=$((100 + GITHUB_RUN_NUMBER))
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            -PvelunaVersionCode="$VER_CODE" \
            -PvelunaVersionName="ci-${GITHUB_RUN_NUMBER}" \
            --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/veluna-android.apk

      - name: Verify latest APK uses the configured release certificate
        env:
          EXPECTED_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          [ -n "$APKSIGNER" ] || { echo "apksigner not found"; exit 1; }
          EXPECTED_NORM=$(printf '%s' "$EXPECTED_SHA256" | tr -d ':' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          CERT_LINE=$("$APKSIGNER" verify --print-certs dist/veluna-android.apk | grep 'certificate SHA-256 digest')
          [ "$(printf '%s\n' "$CERT_LINE" | wc -l)" = "1" ] || { echo "Expected exactly one signer SHA-256 line"; exit 1; }
          ACTUAL=$(printf '%s' "$CERT_LINE" | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          [ "$ACTUAL" = "$EXPECTED_NORM" ] || { echo "APK certificate SHA-256 mismatch"; exit 1; }

      - name: Publish or update the latest successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ci-latest >/dev/null 2>&1; then
            gh release upload ci-latest dist/veluna-android.apk --clobber
            gh release edit ci-latest \
              --title "Latest successful build" \
              --notes "Signed installable APK from commit ${GITHUB_SHA}. Built after CI and Android instrumentation tests passed." \
              --prerelease
          else
            gh release create ci-latest dist/veluna-android.apk \
              --title "Latest successful build" \
              --notes "Signed installable APK from commit ${GITHUB_SHA}. Built after CI and Android instrumentation tests passed." \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi

  build-release:
    name: Build & Publish Signed Release APK
    needs: [test, instrumentation-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag is on main or master
        run: |
          git fetch origin main master --no-tags
          set -euo pipefail
          ok=0
          for b in origin/main origin/master; do
            if git rev-parse -q --verify "$b" >/dev/null \
               && git merge-base --is-ancestor "$GITHUB_SHA" "$b"; then
              ok=1
            fi
          done
          [ "$ok" = 1 ] || { echo "Release tag commit is not reachable from main or master"; exit 1; }

      - name: Require release secrets
        env:
          KS_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          EXPECTED_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          [ -n "$KS_B64" ] || { echo "Missing ANDROID_RELEASE_KEYSTORE_BASE64 secret"; exit 1; }
          [ -n "$KS_PASS" ] || { echo "Missing RELEASE_KEYSTORE_PASSWORD secret"; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "Missing RELEASE_KEY_ALIAS secret"; exit 1; }
          [ -n "$KEY_PASS" ] || { echo "Missing RELEASE_KEY_PASSWORD secret"; exit 1; }
          [ -n "$GS_JSON" ] || { echo "Missing GOOGLE_SERVICES_JSON secret"; exit 1; }
          [ -n "$EXPECTED_SHA256" ] || { echo "Missing RELEASE_CERT_SHA256 repository variable"; exit 1; }

      - name: Materialize release signing & Firebase config
        env:
          KS_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          printf '%s\n' "$GS_JSON" > app/google-services.json
          [ -s "$RUNNER_TEMP/release.jks" ] || { echo "Failed to decode release keystore"; exit 1; }
          [ -s app/google-services.json ] || { echo "Failed to write google-services.json"; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Android SDK licenses are accepted
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Validate Gradle Wrapper & Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Assemble release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          VER_CODE=$((100 + GITHUB_RUN_NUMBER))
          VER_NAME="${GITHUB_REF_NAME#v}"
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PvelunaVersionCode="${VER_CODE}" \
            -PvelunaVersionName="${VER_NAME}"

      - name: Verify release APK signature & non-debuggable manifest
        env:
          EXPECTED_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          [ -n "$APK_PATH" ] && [ -s "$APK_PATH" ] || { echo "Release APK not found"; exit 1; }
          cp "$APK_PATH" dist/veluna-android.apk
          AAPT2=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name aapt2 | sort -V | tail -n 1)
          [ -n "$AAPT2" ] || { echo "aapt2 not found"; exit 1; }
          if "$AAPT2" dump badging dist/veluna-android.apk | grep -q "application-debuggable"; then
            echo "Refusing to publish a debuggable APK"
            exit 1
          fi
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          [ -n "$APKSIGNER" ] || { echo "apksigner not found"; exit 1; }
          EXPECTED_NORM=$(printf '%s' "$EXPECTED_SHA256" | tr -d ':' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          CERT_LINE=$("$APKSIGNER" verify --print-certs dist/veluna-android.apk | grep 'certificate SHA-256 digest')
          [ "$(printf '%s\n' "$CERT_LINE" | wc -l)" = "1" ] || { echo "Expected exactly one signer SHA-256 line"; exit 1; }
          ACTUAL=$(printf '%s' "$CERT_LINE" | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          [ "$ACTUAL" = "$EXPECTED_NORM" ] || { echo "APK certificate SHA-256 mismatch"; exit 1; }

      - name: Upload release APK artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: veluna-android-release-apk
          path: dist/veluna-android.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: Veluna ${{ github.ref_name }}
          body: |
            Signed release APK for **Veluna** (Android 8.0+ / API 26+).

            ### Verify Integrity
            Verify the APK signing certificate SHA-256 before installing:
            `apksigner verify --print-certs veluna-android.apk`
          files: dist/veluna-android.apk
          draft: false
          prerelease: false
          generate_release_notes: true
